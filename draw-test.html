<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ทดลองวาดโหลดโปรไฟล์ (ทดลอง)</title>
<link rel="stylesheet" href="style.css?v=4">
<style>
  body { padding: 16px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  canvas { width: 100%; height: auto; touch-action: none; cursor: crosshair; background: #0f1420; border-radius: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .row button, .row select, .row input { font-size: 14px; padding: 6px 10px; }
  .res { margin-top: 12px; }
  .res table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .res th, .res td { border-bottom: 1px solid #2a3344; padding: 6px 8px; text-align: right; }
  .res th:first-child, .res td:first-child { text-align: left; }
  .note { font-size: 13px; opacity: .75; }
  .sel { background: #1e2736; }
</style>
</head>
<body>
<div class="wrap">
  <h2>✏️ ทดลองวาดโหลดโปรไฟล์ <span class="note">(หน้าทดลอง ยังไม่ใช่หน้าหลัก)</span></h2>
  <p class="note">ลากเมาส์บนกราฟเพื่อกำหนดกำลังไฟ (kW) ของแต่ละชั่วโมง · วาดได้ทั้งคอมและมือถือ · ย้อนกลับได้ (Ctrl+Z)</p>

  <div class="row">
    <label>อัตราค่าไฟ
      <select id="preset">
        <option value="tou">TOU (On/Off-Peak)</option>
        <option value="prog5">อัตราก้าวหน้า 5 ขั้น (1.1.1)</option>
        <option value="prog3">อัตราก้าวหน้า 3 ขั้น (1.1.2)</option>
        <option value="flat">อัตราคงที่ (Flat)</option>
      </select>
    </label>
    <label>แกน kW สูงสุด
      <input id="kmax" type="number" min="5" max="500" step="5" value="60" style="width:80px">
    </label>
  </div>

  <canvas id="cv" width="960" height="380"></canvas>

  <div class="row">
    <button id="undo" title="ย้อนกลับ (Ctrl+Z)">↶ ย้อนกลับ</button>
    <button id="redo" title="ทำซ้ำ (Ctrl+Y)">↷ ทำซ้ำ</button>
    <button id="clear">🧹 ล้างกราฟ</button>
    <button id="sample">🏠 ตัวอย่างบ้านทั่วไป</button>
    <span class="note" id="status"></span>
  </div>

  <div class="res" id="result"></div>
</div>

<script src="core.js"></script>
<script src="draw-calc.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var PL = 56, PR = 12, PT = 12, PB = 34;     // ระยะขอบ (plot left/right/top/bottom)
  var CELL_W = (cv.width - PL - PR) / 24;

  var hourly = Array(24).fill(0.5);
  var past = [], future = [];
  var LIMIT = 200;
  var drawing = false, lastH = null;

  var sel = document.getElementById('preset');
  var kmaxEl = document.getElementById('kmax');

  function kmax() {
    var v = Number(kmaxEl.value);
    return v >= 5 && v <= 500 ? v : 60;
  }

  function plotH() { return cv.height - PT - PB; }
  function yOf(kw) { return PT + plotH() * (1 - Math.min(kw, kmax()) / kmax()); }

  function snapshot() { past.push(hourly.slice()); if (past.length > LIMIT) past.shift(); future = []; }

  function setStatus(t) { document.getElementById('status').textContent = t; }

  function render() {
    var W = cv.width, H = cv.height, K = kmax();
    ctx.clearRect(0, 0, W, H);
    // เส้นกริดแกน y
    ctx.font = '13px sans-serif';
    ctx.strokeStyle = '#2a3344'; ctx.fillStyle = '#9aa6bd'; ctx.lineWidth = 1;
    var step = K / 4;
    for (var i = 0; i <= 4; i++) {
      var kv = step * i, y = yOf(kv);
      ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke();
      ctx.fillText(kv.toFixed(0) + ' kW', 4, y + 4);
    }
    // แท่งแต่ละชั่วโมง
    for (var h = 0; h < 24; h++) {
      var x = PL + h * CELL_W;
      var top = yOf(hourly[h]), bottom = yOf(0);
      var onPeak = h >= 9 && h < 22;
      ctx.fillStyle = onPeak ? 'rgba(255,170,60,.85)' : 'rgba(90,170,255,.85)';
      ctx.fillRect(x + 2, top, CELL_W - 4, bottom - top);
      if (h % 3 === 0) {
        ctx.fillStyle = '#9aa6bd';
        ctx.fillText(String(h).padStart(2, '0') + ':00', x + 2, H - 12);
      }
    }
    ctx.fillStyle = '#9aa6bd';
    ctx.fillText('ส้ม = On-Peak (09–22) · ฟ้า = Off-Peak', PL, H - 12 + 0);
  }

  function pos(e) {
    var r = cv.getBoundingClientRect();
    var sx = cv.width / r.width, sy = cv.height / r.height;
    return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
  }

  function applyAt(e) {
    var p = pos(e);
    if (p.x < PL || p.x > cv.width - PR || p.y < PT || p.y > cv.height - PB) return;
    var h = Math.min(23, Math.max(0, Math.floor((p.x - PL) / CELL_W)));
    var kw = (1 - (p.y - PT) / plotH()) * kmax();
    kw = Math.round(Math.min(kmax(), Math.max(0, kw)) * 10) / 10;
    // ลากเร็ว: เติมชั่วโมงที่ข้ามไปด้วย
    var from = lastH === null ? h : lastH;
    var lo = Math.min(from, h), hi = Math.max(from, h);
    for (var k = lo; k <= hi; k++) hourly[k] = kw;
    lastH = h;
    render(); update();
  }

  cv.addEventListener('pointerdown', function (e) {
    snapshot(); drawing = true; lastH = null;
    cv.setPointerCapture(e.pointerId);
    applyAt(e);
  });
  cv.addEventListener('pointermove', function (e) { if (drawing) applyAt(e); });
  function endStroke() { drawing = false; lastH = null; }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);

  function undo() {
    if (!past.length) { setStatus('ไม่มีอะไรให้ย้อนกลับ'); return; }
    future.push(hourly.slice()); hourly = past.pop(); render(); update(); setStatus('ย้อนกลับแล้ว');
  }
  function redo() {
    if (!future.length) { setStatus('ไม่มีอะไรให้ทำซ้ำ'); return; }
    past.push(hourly.slice()); hourly = future.pop(); render(); update(); setStatus('ทำซ้ำแล้ว');
  }

  document.getElementById('undo').onclick = undo;
  document.getElementById('redo').onclick = redo;
  document.getElementById('clear').onclick = function () {
    snapshot(); hourly = Array(24).fill(0); render(); update(); setStatus('ล้างแล้ว (ย้อนกลับได้)');
  };
  document.getElementById('sample').onclick = function () {
    // โปรไฟล์บ้านทั่วไป: ต่ำตอนกลางคืน สูงช่วงเย็น
    var s = [0.3,0.3,0.3,0.3,0.3,0.3,0.5,0.8,1.0,1.2,1.2,1.0,1.0,1.0,1.1,1.5,2.5,4.0,5.0,4.5,3.5,2.0,1.0,0.5];
    snapshot(); hourly = s; render(); update(); setStatus('ใส่ตัวอย่างแล้ว (ย้อนกลับได้)');
  };
  sel.onchange = update;
  kmaxEl.onchange = function () { render(); update(); };

  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === 'z' || e.key === 'Z') { e.preventDefault(); undo(); }
    if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redo(); }
  });

  function fmt(n, d) { return Number(n).toLocaleString('th-TH', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }

  function update() {
    var r = document.getElementById('result');
    var chosen = DrawCalc.monthlyBill(hourly, sel.value);
    var all = DrawCalc.compareAll(hourly);
    var d = chosen.daily;
    r.innerHTML =
      '<p><b>วันหนึ่ง:</b> ' + fmt(d.totalKwh, 1) + ' kWh (On-Peak ' + fmt(d.onKwh, 1) +
      ' / Off-Peak ' + fmt(d.offKwh, 1) + ') · Peak ' + fmt(d.peakKw, 1) + ' kW</p>' +
      '<p><b>ทั้งเดือน (30 วัน):</b> ' + fmt(chosen.monthlyKwh, 0) + ' kWh · ค่าไฟโดยประมาณ <b>' +
      fmt(chosen.monthly.grandTotal, 0) + ' บาท</b> (อัตรา: ' + chosen.label + ')</p>' +
      '<table><tr><th>อัตรา</th><th>ค่าไฟ/เดือน (บาท)</th></tr>' +
      all.map(function (x) {
        return '<tr' + (x.preset === sel.value ? ' class="sel"' : '') + '><td>' + x.label +
          '</td><td>' + fmt(x.monthly.grandTotal, 0) + '</td></tr>';
      }).join('') + '</table>' +
      '<p class="note">หมายเหตุ: ตัวเลขนี้คิดจากโปรไฟล์ที่วาด ไม่ได้หักค่าโซลาร์ · วันทุกวันเหมือนกัน 30 วัน</p>';
  }

  render(); update();
})();
</script>
</body>
</html>
